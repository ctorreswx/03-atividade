<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
</head>
<body>
    <header style="display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex;align-items:center;gap:5px">
        <h1>Learning Languages with Clara</h1>
        <h2>- a connection through <i>words</i> and <i>culture</i></h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <hr>
    <main>
    <section>
        <h2>Contact Me</h2>
        <p>If you have any questions or would like to get in touch, feel free to reach out!</p>
        <form action="">
          <fieldset>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Maya Marie" required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="maya.marie@email.com" required>
            <br><br>
            <label for="subject">Subject:</label>
            <select id="subject" name="subject" required>
              <option value="">Select a category</option>
              <option value="feedback">Feedback</option>
              <option value="general">General Inquiry</option>
              <option value="collaboration">Suggestions</option>
              <option value="other">Other</option>
            </select>
            <br><br>
            <label for="message">Message:</label> <br>
            <textarea id="message" name="message" rows="5" placeholder="Enter your message here..." required></textarea>
            <br><br>
            <label>
            <input type="checkbox" name="checkbox" id="checkbox" required>I agree to the terms and conditions
            </label><br><br>
            <button>Send formulary</button>
          </fieldset>
        </form>
    </section>
    </main>
</body>
</html>
